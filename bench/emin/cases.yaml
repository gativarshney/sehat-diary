# Pre-registered E-min cases. Do not edit after results exist; add amendments to PROTOCOL.md.
# script_roman: what Gati says (Hinglish). script_dev: the same in Devanagari for reference.
# expect: numeric values the parser must recover. kind: bp | sugar | weight | correction | none.
# ambiguous: true when we expect the parser to (correctly) flag doubt.

- id: bp_by
  script_roman: "BP ek sau atthais by bayasi"
  script_dev: "बीपी एक सौ अट्ठाईस बाय बयासी"
  kind: bp
  expect: [128, 82]
  ambiguous: false

- id: bp_bata
  script_roman: "blood pressure ek sau bees bata assi"
  script_dev: "ब्लड प्रेशर एक सौ बीस बटा अस्सी"
  kind: bp
  expect: [120, 80]
  ambiguous: false

